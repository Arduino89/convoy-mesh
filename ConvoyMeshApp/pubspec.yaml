name: convoy_mesh
description: Convoy Mesh - walking groups, BLE and GPS
publish_to: "none"
version: 0.7.7-outdoor+16

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.4.0
  flutter_reactive_ble: ^5.4.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  flutter_ble_peripheral: ^2.0.1
  shared_preferences: ^2.2.3
  app_settings: ^5.1.1
  sensors_plus: ^7.0.0
  share_plus: 11.1.0
  cross_file: 0.3.5+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
