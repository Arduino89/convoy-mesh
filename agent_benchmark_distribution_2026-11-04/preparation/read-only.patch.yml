# Preparation only; not the benchmark prompt or an authorization to run it.
# Verified against @deepseek-ai/dsh 0.2.1-rc.5, not moving master.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: read-only
    presets:
      read-only:
        sandbox: read-only
        approval: never
- id: tool-fs
  config:
    read: true
    readImage: false
    write: false
    edit: false
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com/anthropic
    reasoningEffort: high
    maxTokens: 8192
    retryPolicy:
      mode: normal
      maxRetries: 0
- id: llm-pi-ai
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: plugin-manager
  disabled: true
