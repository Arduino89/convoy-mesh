name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - 'tools/android_smoke.sh'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - 'tools/android_smoke.sh'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Capture exact source
        run: |
          mkdir -p build-evidence
          git archive --format=zip HEAD -o build-evidence/source.zip
          git rev-parse HEAD > build-evidence/checkout-sha.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > build-evidence/head-sha.txt
          bash -n tools/android_smoke.sh

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: convoy-source-snapshot
          path: build-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ConvoyMeshApp/android/*.gradle*
            ConvoyMeshApp/android/gradle/wrapper/gradle-wrapper.properties
            ConvoyMeshApp/android/app/*.gradle*

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ConvoyMeshApp
        run: |
          flutter --version --machine > ../build-evidence/flutter-version.json
          flutter pub get
          cp pubspec.lock ../build-evidence/resolved-pubspec.lock

      - name: Test
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter test --no-pub --coverage --reporter expanded 2>&1 | tee ../flutter-test.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-log
          path: |
            flutter-test.log
            ConvoyMeshApp/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Analyze
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../flutter-analyze.log

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-analyze-log
          path: flutter-analyze.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        working-directory: ConvoyMeshApp
        run: flutter build apk --debug --dart-define=BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fingerprint APK
        run: |
          sha256sum ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk > build-evidence/apk-sha256.txt
          printf '%s\n' 'Candidate debug APK. Automated checks are not real-device BLE/GNSS certification.' > build-evidence/validation-scope.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: convoy-mesh-debug-apk
          path: |
            ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk
            build-evidence/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convoy-build-provenance
          path: |
            build-evidence/*sha.txt
            build-evidence/*sha256.txt
            build-evidence/flutter-version.json
            build-evidence/resolved-pubspec.lock
            build-evidence/validation-scope.txt
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare diagnostics and KVM
        run: |
          mkdir -p emulator-artifacts
          date -u > emulator-artifacts/job-started.txt
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm > emulator-artifacts/kvm.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the validated APK
        uses: actions/download-artifact@v8
        with:
          name: convoy-mesh-debug-apk
          path: emulator-apk

      - name: Locate exact APK
        run: |
          mapfile -t APKS < <(find emulator-apk -type f -name 'app-debug.apk')
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" emulator-artifacts/candidate.apk
          sha256sum emulator-artifacts/candidate.apk > emulator-artifacts/apk-sha256.txt

      - name: Install and exercise screen-off runtime
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash tools/android_smoke.sh emulator-artifacts/candidate.apk

      - name: Remove duplicate APK from diagnostics
        if: always()
        run: rm -f emulator-artifacts/candidate.apk

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-diagnostics
          path: emulator-artifacts
          if-no-files-found: error
          retention-days: 14
