name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - 'tools/android_smoke.sh'
      - '.github/workflows/android-debug.yml'
  push:
    # The experimental PR targets fix/v0.4-stability, so only this push event
    # builds it. Avoid duplicate push + pull_request candidate artifacts.
    branches: [ main, experiment/pedestrian-acquisition-v1, experiment/manual-ping-20261114, experiment/diagnostic-control-20261114, experiment/frontend-design-studio, experiment/wifi-direct-offline-lab-20261121 ]
    paths:
      - 'ConvoyMeshApp/**'
      - 'tools/android_smoke.sh'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.ref_name == 'experiment/wifi-direct-offline-lab-20261121' && 45 || 25 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # One parent is needed for the bounded baseline counterproof below.
          fetch-depth: 2

      - name: Capture exact source
        run: |
          mkdir -p build-evidence
          git archive --format=zip HEAD -o build-evidence/source.zip
          git rev-parse HEAD > build-evidence/checkout-sha.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > build-evidence/head-sha.txt
          cmp build-evidence/checkout-sha.txt build-evidence/head-sha.txt
          bash -n tools/android_smoke.sh

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: convoy-source-snapshot
          path: build-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ConvoyMeshApp/android/*.gradle*
            ConvoyMeshApp/android/gradle/wrapper/gradle-wrapper.properties
            ConvoyMeshApp/android/app/*.gradle*

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same SDK as baseline run #105, not a moving stable channel.
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        working-directory: ConvoyMeshApp
        run: |
          flutter --version --machine > ../build-evidence/flutter-version.json
          # Preserve the recovered run #105 resolution, including the four
          # transitive versions that a fresh resolution would otherwise update.
          flutter pub get --enforce-lockfile
          cp pubspec.lock ../build-evidence/resolved-pubspec.lock

      - name: Test
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter test --no-pub --coverage --reporter expanded 2>&1 | tee ../flutter-test.log

      - name: Counterproof against the uncorrected Outdoor checkpoint
        if: github.ref_name == 'experiment/frontend-design-studio'
        shell: bash
        run: |
          set -euo pipefail
          BASE=b8ea08992c8d129f2a83eb79d43a5a2975bc3b7a
          # Only run for the correction commit (or a rerun of that commit).
          # All later routine builds continue with the ordinary regression suite.
          if [[ "$(git rev-parse HEAD^)" != "$BASE" ]]; then
            echo "Counterproof not required for this checkpoint"
            exit 0
          fi
          baseline=$(mktemp -d "$RUNNER_TEMP/convoy-counterproof.XXXXXX")
          trap 'rm -rf "$baseline"' EXIT
          git archive "$BASE" | tar -x -C "$baseline"
          cp ConvoyMeshApp/test/outdoor_residual_regression_test.dart "$baseline/ConvoyMeshApp/test/"
          cd "$baseline/ConvoyMeshApp"
          flutter pub get --enforce-lockfile
          for case_id in D2 D9 D11; do
            case "$case_id" in
              D2) marker=D2_EXPECT_HIDDEN_MUTED ;;
              D9) marker=D9_EXPECT_NEW_RATE ;;
              D11) marker=D11_EXPECT_SAME_MAP ;;
            esac
            log="$GITHUB_WORKSPACE/counterproof-$case_id.log"
            if flutter test --no-pub --reporter expanded test/outdoor_residual_regression_test.dart --plain-name "$case_id" 2>&1 | tee "$log"; then
              echo "::error::$case_id unexpectedly passed on the old source"
              exit 1
            else
              rc=$?
            fi
            if [[ "$rc" != 1 ]] || ! grep -Fq "$marker" "$log"; then
              echo "::error::$case_id failed for an unproven reason; inspect its log"
              exit 1
            fi
            echo "$case_id: expected baseline assertion failure confirmed ($BASE)"
          done

      - name: Counterproof for warm GPS preview promotion
        if: github.ref_name == 'experiment/frontend-design-studio'
        shell: bash
        run: |
          set -euo pipefail
          BASE=2227afac78d26932dfde49e2d6cead4df7388fcf
          if [[ "$(git rev-parse HEAD^)" != "$BASE" ]]; then
            echo "GPS promotion counterproof not required for this checkpoint"
            exit 0
          fi
          baseline=$(mktemp -d "$RUNNER_TEMP/convoy-gps-counterproof.XXXXXX")
          trap 'rm -rf "$baseline"' EXIT
          git archive "$BASE" | tar -x -C "$baseline"
          cp ConvoyMeshApp/test/location_service_contract_test.dart "$baseline/ConvoyMeshApp/test/"
          cd "$baseline/ConvoyMeshApp"
          flutter pub get --enforce-lockfile
          log="$GITHUB_WORKSPACE/counterproof-gps-promotion.log"
          if flutter test --no-pub --reporter expanded test/location_service_contract_test.dart --plain-name 'warm preview promotion' 2>&1 | tee "$log"; then
            echo "::error::Warm promotion unexpectedly passed on baseline"
            exit 1
          else
            rc=$?
          fi
          if [[ "$rc" != 1 ]] || ! grep -Fq 'GPS_WARM_PROMOTION' "$log"; then
            echo "::error::Baseline failed for an unproven reason"
            exit 1
          fi
          echo "Expected warm promotion baseline failure confirmed"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-log
          path: |
            flutter-test.log
            counterproof-*.log
            ConvoyMeshApp/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 90

      - name: Analyze
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../flutter-analyze.log

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-analyze-log
          path: flutter-analyze.log
          if-no-files-found: warn
          retention-days: 90

      - name: Build debug APK
        working-directory: ConvoyMeshApp
        env:
          ORG_GRADLE_PROJECT_convoyExperimental: 'true'
          ORG_GRADLE_PROJECT_convoyPingLab: ${{ github.ref_name == 'experiment/manual-ping-20261114' && 'true' || 'false' }}
          ORG_GRADLE_PROJECT_convoyDiagnosticLab: ${{ github.ref_name == 'experiment/diagnostic-control-20261114' && 'true' || 'false' }}
          ORG_GRADLE_PROJECT_convoyOutdoorLab: ${{ github.ref_name == 'experiment/frontend-design-studio' && 'true' || 'false' }}
          # This branch's integrated Wi-Fi build receives no PostHog secret.
        run: |
          if [[ "$GITHUB_REF_NAME" == "experiment/manual-ping-20261114" || "$GITHUB_REF_NAME" == "experiment/diagnostic-control-20261114" || "$GITHUB_REF_NAME" == "experiment/frontend-design-studio" ]]; then
            if [[ ! "$CONVOY_LAB_POSTHOG_TOKEN" =~ ^phc_[A-Za-z0-9_-]{16,200}$ || "$CONVOY_LAB_POSTHOG_TOKEN" == "phc_synthetic_local_only" ]]; then
              echo "::error::Existing LAB ingestion secret missing or invalid; refusing unconfigured ping APK"
              exit 1
            fi
            export PING_DEFINES_FILE="$RUNNER_TEMP/convoy-ping-defines.json"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["PING_DEFINES_FILE"])
          path.write_text(json.dumps({
              "CONVOY_POSTHOG_PROJECT_TOKEN": os.environ["CONVOY_LAB_POSTHOG_TOKEN"],
          }))
          path.chmod(0o600)
          PY
            trap 'rm -f "$PING_DEFINES_FILE"' EXIT
            if [[ "$GITHUB_REF_NAME" == "experiment/diagnostic-control-20261114" ]]; then
              flutter build apk --no-pub --debug --dart-define=BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }} --dart-define=CONVOY_APP_VERSION=0.7.7-diaglab+15 --dart-define-from-file="$PING_DEFINES_FILE"
            elif [[ "$GITHUB_REF_NAME" == "experiment/frontend-design-studio" ]]; then
              # Owner-authorized closed beta, not a public release. Manual consent only.
              flutter build apk --no-pub --debug --dart-define=BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }} --dart-define=CONVOY_APP_VERSION=0.7.7-outdoor+20 --dart-define=CONVOY_DEFAULT_OUTDOOR=true --dart-define-from-file="$PING_DEFINES_FILE"
            else
              flutter build apk --no-pub --debug --dart-define=BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }} --dart-define-from-file="$PING_DEFINES_FILE"
            fi
          else
            if [[ "$GITHUB_REF_NAME" == "experiment/wifi-direct-offline-lab-20261121" ]]; then
              export ORG_GRADLE_PROJECT_convoyOutdoorLab=true
              flutter build apk --no-pub --debug --dart-define=BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }} --dart-define=CONVOY_APP_VERSION=0.7.7-outdoor+26 --dart-define=CONVOY_DEFAULT_OUTDOOR=true --dart-define=CONVOY_WIFI_DIRECT_LAB_INTEGRATED=true --dart-define=CONVOY_POSTHOG_TEMPORARILY_DISABLED=true
            else
              flutter build apk --no-pub --debug --dart-define=BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            fi
          fi

      - name: Test native Wi-Fi Direct session guards
        if: github.ref_name == 'experiment/wifi-direct-offline-lab-20261121'
        working-directory: ConvoyMeshApp/android
        run: bash gradlew :app:testDebugUnitTest

      - name: Verify APK identity, signature and compatibility
        run: |
          set -o pipefail
          APK=ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk
          SDK_ROOT=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build-evidence/apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee build-evidence/apk-badging.txt
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          info = Path('build-evidence/apk-badging.txt').read_text()
          ref = os.environ.get('GITHUB_REF_NAME', '')
          integrated_wifi_lab = ref == 'experiment/wifi-direct-offline-lab-20261121'
          outdoor_lab = ref in ('experiment/frontend-design-studio', 'experiment/wifi-direct-offline-lab-20261121')
          diag_lab = ref == 'experiment/diagnostic-control-20261114'
          ping_lab = ref == 'experiment/manual-ping-20261114'
          app_id = 'com.example.convoy_mesh.outdoor' if outdoor_lab else ('com.example.convoy_mesh.diaglab' if diag_lab else ('com.example.convoy_mesh.pinglab2' if ping_lab else 'com.example.convoy_mesh.pedestrianexp1'))
          version_code = '26' if integrated_wifi_lab else ('20' if outdoor_lab else ('15' if diag_lab else ('11' if ping_lab else '9')))
          version_name = '0.7.7-outdoor' if outdoor_lab else ('0.7.7-diaglab' if diag_lab else ('0.7.7-pinglab' if ping_lab else '0.7.7-exp1'))
          app_label = 'Convoy Outdoor LAB' if outdoor_lab else ('Convoy Diagnostics LAB' if diag_lab else ('Convoy Ping LAB 2' if ping_lab else 'Convoy Mesh Exp'))
          assert f"package: name='{app_id}'" in info
          assert f"versionCode='{version_code}'" in info and f"versionName='{version_name}'" in info
          assert f"application-label:'{app_label}'" in info
          minimum = int(re.search(r"^sdkVersion:'(\d+)'", info, re.M).group(1))
          assert minimum <= 29, f'Unsupported on the API 29 field phone: {minimum}'
          assert "'arm64-v8a'" in info and "'x86_64'" in info
          PY
          sha256sum "$APK" > build-evidence/apk-sha256.txt
          printf '%s\n' 'Candidate debug APK. Automated checks are not real-device BLE/GNSS certification.' > build-evidence/validation-scope.txt
          if [[ "$GITHUB_REF_NAME" == "experiment/wifi-direct-offline-lab-20261121" ]]; then
            printf '%s\n' 'Integrated Wi-Fi debug candidate: package outdoor and version 26, but DEBUG certificate differs from permanent beta. Do not replace the signed beta or uninstall anything. This is not yet the deliverable.' > build-evidence/install-policy.txt
          else
          printf '%s\n' 'Side-by-side package: not an update of com.example.convoy_mesh. Old app/data remain installed. Independent permissions, identity and storage. Use only one Convoy app at a time. Debug key is not retained; future rebuilds are not guaranteed compatible updates. Baseline run #105 APK is unavailable (artifact 10300013706 returns 404); its certificate cannot be compared.' > build-evidence/install-policy.txt
          fi

      # One authorized synthetic transmission only, on the integration checkpoint.
      # Ordinary builds, test reruns, and future commits never send cloud events.
      - name: Closed beta synthetic cloud round-trip sender
        if: github.ref_name == 'experiment/frontend-design-studio' && github.run_attempt == 1
        working-directory: ConvoyMeshApp
        shell: bash
        env:
          CONVOY_LAB_POSTHOG_TOKEN: ${{ secrets.CONVOY_LAB_POSTHOG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD^)" != "a91ff715ae13bd0525f8bfdeb4b023bad1817597" ]]; then
            echo "One-shot cloud fixture not authorized for this checkpoint"
            exit 0
          fi
          if [[ ! "$CONVOY_LAB_POSTHOG_TOKEN" =~ ^phc_[A-Za-z0-9_-]{16,200}$ || "$CONVOY_LAB_POSTHOG_TOKEN" == "phc_synthetic_local_only" ]]; then
            echo "::error::Existing LAB ingestion secret missing or invalid"
            exit 1
          fi
          export FIXTURE_DEFINES=$(mktemp "$RUNNER_TEMP/convoy-fixture.XXXXXX")
          chmod 600 "$FIXTURE_DEFINES"
          trap 'rm -f "$FIXTURE_DEFINES"' EXIT
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ["FIXTURE_DEFINES"]).write_text(json.dumps({
              "CONVOY_POSTHOG_PROJECT_TOKEN": os.environ["CONVOY_LAB_POSTHOG_TOKEN"]
          }))
          PY
          flutter test --no-pub --reporter expanded --dart-define-from-file="$FIXTURE_DEFINES" --dart-define=CONVOY_SYNTHETIC_RUN_ID="$GITHUB_RUN_ID" tool/diagnostic_cloud_fixture_test.dart

      - name: Upload synthetic cloud manifest
        if: always() && github.ref_name == 'experiment/frontend-design-studio' && hashFiles('build-evidence/synthetic-cloud-expected.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: convoy-synthetic-cloud-expected
          path: build-evidence/synthetic-cloud-expected.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK artifact
        if: github.ref_name != 'experiment/wifi-direct-offline-lab-20261121'
        uses: actions/upload-artifact@v7
        with:
          name: convoy-mesh-debug-apk
          path: |
            ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk
            build-evidence/apk-sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Split the exact APK for bounded downloads
        if: github.ref_name != 'experiment/wifi-direct-offline-lab-20261121'
        run: |
          # Transport parts only: no second build, signing or APK variant.
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path('ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk')
          output = Path('build-evidence/apk-parts')
          output.mkdir()
          chunk_bytes = 24 * 1024 * 1024
          assert 0 < apk.stat().st_size <= 8 * chunk_bytes, 'APK exceeds bounded transport capacity'
          parts = []
          digest = hashlib.sha256()
          with apk.open('rb') as source:
              while data := source.read(chunk_bytes):
                  name = f'part-{len(parts):02}'
                  (output / name).write_bytes(data)
                  digest.update(data)
                  parts.append({'file': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          expected = Path('build-evidence/apk-sha256.txt').read_text().split()[0]
          assert digest.hexdigest() == expected, 'APK changed after fingerprinting'
          manifest = {
              'source_sha': Path('build-evidence/checkout-sha.txt').read_text().strip(),
              'apk_file': apk.name, 'apk_bytes': apk.stat().st_size,
              'apk_sha256': expected, 'parts': parts,
          }
          Path('build-evidence/apk-transport-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload APK transport part 00
        if: ${{ hashFiles('build-evidence/apk-parts/part-00') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-00
          path: build-evidence/apk-parts/part-00
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 01
        if: ${{ hashFiles('build-evidence/apk-parts/part-01') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-01
          path: build-evidence/apk-parts/part-01
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 02
        if: ${{ hashFiles('build-evidence/apk-parts/part-02') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-02
          path: build-evidence/apk-parts/part-02
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 03
        if: ${{ hashFiles('build-evidence/apk-parts/part-03') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-03
          path: build-evidence/apk-parts/part-03
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 04
        if: ${{ hashFiles('build-evidence/apk-parts/part-04') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-04
          path: build-evidence/apk-parts/part-04
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 05
        if: ${{ hashFiles('build-evidence/apk-parts/part-05') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-05
          path: build-evidence/apk-parts/part-05
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 06
        if: ${{ hashFiles('build-evidence/apk-parts/part-06') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-06
          path: build-evidence/apk-parts/part-06
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 07
        if: ${{ hashFiles('build-evidence/apk-parts/part-07') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-07
          path: build-evidence/apk-parts/part-07
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convoy-build-provenance
          path: |
            build-evidence/*sha.txt
            build-evidence/*sha256.txt
            build-evidence/flutter-version.json
            build-evidence/resolved-pubspec.lock
            build-evidence/validation-scope.txt
            build-evidence/apk-signature.txt
            build-evidence/apk-badging.txt
            build-evidence/install-policy.txt
            build-evidence/apk-transport-manifest.json
          if-no-files-found: error
          retention-days: 90

      # Test the Wi-Fi LAB build on this runner without uploading the APK.
      - name: Prepare KVM for Wi-Fi LAB smoke
        if: github.ref_name == 'experiment/wifi-direct-offline-lab-20261121'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sha256sum --check build-evidence/apk-sha256.txt

      - name: Exercise Wi-Fi LAB and Outdoor on API 35
        if: github.ref_name == 'experiment/wifi-direct-offline-lab-20261121'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: EXPECTED_OUTDOOR_VERSION=0.7.7-outdoor+26 EXPECTED_BUILD_COMMIT=${{ github.sha }} bash tools/android_smoke.sh ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk com.example.convoy_mesh.outdoor

  android-emulator-smoke:
    if: github.ref_name != 'experiment/wifi-direct-offline-lab-20261121'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare diagnostics and KVM
        run: |
          mkdir -p emulator-artifacts
          date -u > emulator-artifacts/job-started.txt
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm > emulator-artifacts/kvm.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the validated APK
        uses: actions/download-artifact@v8
        with:
          name: convoy-mesh-debug-apk
          path: emulator-apk

      - name: Locate exact APK
        run: |
          mapfile -t APKS < <(find emulator-apk -type f -name 'app-debug.apk')
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" emulator-artifacts/candidate.apk
          sha256sum emulator-artifacts/candidate.apk > emulator-artifacts/apk-sha256.txt

      - name: Install and exercise screen-off runtime
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: EXPECTED_OUTDOOR_VERSION=${{ github.ref_name == 'experiment/wifi-direct-offline-lab-20261121' && '0.7.7-outdoor+22' || '0.7.7-outdoor+20' }} EXPECTED_BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }} bash tools/android_smoke.sh emulator-artifacts/candidate.apk ${{ (github.ref_name == 'experiment/wifi-direct-offline-lab-20261121' || github.ref_name == 'experiment/frontend-design-studio') && 'com.example.convoy_mesh.outdoor' || (github.ref_name == 'experiment/diagnostic-control-20261114' && 'com.example.convoy_mesh.diaglab' || (github.ref_name == 'experiment/manual-ping-20261114' && 'com.example.convoy_mesh.pinglab2' || 'com.example.convoy_mesh.pedestrianexp1')) }}
      - name: Remove duplicate APK from diagnostics
        if: always()
        run: rm -f emulator-artifacts/candidate.apk

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-diagnostics
          path: emulator-artifacts
          if-no-files-found: error
          retention-days: 90
