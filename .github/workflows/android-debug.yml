name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - '.github/workflows/android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ConvoyMeshApp
        run: flutter pub get

      - name: Analyze
        working-directory: ConvoyMeshApp
        run: flutter analyze

      - name: Build debug APK
        working-directory: ConvoyMeshApp
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: convoy-mesh-debug-apk
          path: ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk
