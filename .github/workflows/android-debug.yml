name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - '.github/workflows/android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ConvoyMeshApp
        run: flutter pub get

      - name: Test
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee ../flutter-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: flutter-test.log

      - name: Analyze
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../flutter-analyze.log

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: flutter-analyze.log

      - name: Build debug APK
        working-directory: ConvoyMeshApp
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: convoy-mesh-debug-apk
          path: ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk
