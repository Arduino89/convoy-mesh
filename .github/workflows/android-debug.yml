name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ConvoyMeshApp/android/*.gradle*
            ConvoyMeshApp/android/gradle/wrapper/gradle-wrapper.properties
            ConvoyMeshApp/android/app/*.gradle*

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ConvoyMeshApp
        run: flutter pub get

      - name: Test
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee ../flutter-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-log
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 14

      - name: Analyze
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../flutter-analyze.log

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-analyze-log
          path: flutter-analyze.log
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK
        working-directory: ConvoyMeshApp
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: convoy-mesh-debug-apk
          path: ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download validated APK
        uses: actions/download-artifact@v8
        with:
          name: convoy-mesh-debug-apk
          path: emulator-apk

      - name: Prepare emulator diagnostics
        run: |
          mkdir -p emulator-artifacts
          date -u > emulator-artifacts/job-started.txt
          ls -la emulator-apk | tee emulator-artifacts/apk-files.txt

      - name: Install and launch on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -uo pipefail
            APK='emulator-apk/app-debug.apk'
            PACKAGE='com.example.convoy_mesh'
            ACTIVITY='com.example.convoy_mesh/.MainActivity'

            adb devices -l | tee emulator-artifacts/adb-devices.txt
            adb wait-for-device
            adb shell getprop sys.boot_completed | tee emulator-artifacts/boot-completed.txt

            set +e
            adb install -r "$APK" 2>&1 | tee emulator-artifacts/install.txt
            INSTALL_RC=${PIPESTATUS[0]}
            set -e
            if [ "$INSTALL_RC" -ne 0 ]; then
              echo "APK installation failed with code $INSTALL_RC"
              exit "$INSTALL_RC"
            fi

            adb shell pm list packages "$PACKAGE" | tee emulator-artifacts/package-list.txt
            adb logcat -c

            set +e
            adb shell am start -W -n "$ACTIVITY" 2>&1 | tee emulator-artifacts/launch.txt
            LAUNCH_RC=${PIPESTATUS[0]}
            set -e

            sleep 15
            adb shell pidof "$PACKAGE" | tee emulator-artifacts/app-pid.txt
            adb shell dumpsys activity activities > emulator-artifacts/activity-dump.txt
            adb logcat -d > emulator-artifacts/logcat.txt

            APP_PID=$(tr -d '\r\n ' < emulator-artifacts/app-pid.txt)
            if [ "$LAUNCH_RC" -ne 0 ] || [ -z "$APP_PID" ]; then
              echo "App did not stay alive after launch"
              exit 1
            fi

            if grep -E "FATAL EXCEPTION|Process: com\.example\.convoy_mesh" emulator-artifacts/logcat.txt; then
              echo "Detected fatal Convoy Mesh crash in emulator logcat"
              exit 1
            fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-diagnostics
          path: emulator-artifacts
          if-no-files-found: error
          retention-days: 14
