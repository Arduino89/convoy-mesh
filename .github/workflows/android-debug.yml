name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'ConvoyMeshApp/**'
      - 'tools/android_smoke.sh'
      - '.github/workflows/android-debug.yml'
  push:
    # The experimental PR targets fix/v0.4-stability, so only this push event
    # builds it. Avoid duplicate push + pull_request candidate artifacts.
    branches: [ main, experiment/pedestrian-acquisition-v1 ]
    paths:
      - 'ConvoyMeshApp/**'
      - 'tools/android_smoke.sh'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Capture exact source
        run: |
          mkdir -p build-evidence
          git archive --format=zip HEAD -o build-evidence/source.zip
          git rev-parse HEAD > build-evidence/checkout-sha.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > build-evidence/head-sha.txt
          cmp build-evidence/checkout-sha.txt build-evidence/head-sha.txt
          bash -n tools/android_smoke.sh

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: convoy-source-snapshot
          path: build-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ConvoyMeshApp/android/*.gradle*
            ConvoyMeshApp/android/gradle/wrapper/gradle-wrapper.properties
            ConvoyMeshApp/android/app/*.gradle*

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same SDK as baseline run #105, not a moving stable channel.
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        working-directory: ConvoyMeshApp
        run: |
          flutter --version --machine > ../build-evidence/flutter-version.json
          # Preserve the recovered run #105 resolution, including the four
          # transitive versions that a fresh resolution would otherwise update.
          flutter pub get --enforce-lockfile
          cp pubspec.lock ../build-evidence/resolved-pubspec.lock

      - name: Test
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter test --no-pub --coverage --reporter expanded 2>&1 | tee ../flutter-test.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-log
          path: |
            flutter-test.log
            ConvoyMeshApp/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 90

      - name: Analyze
        working-directory: ConvoyMeshApp
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../flutter-analyze.log

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-analyze-log
          path: flutter-analyze.log
          if-no-files-found: warn
          retention-days: 90

      - name: Build debug APK
        working-directory: ConvoyMeshApp
        env:
          ORG_GRADLE_PROJECT_convoyExperimental: 'true'
        run: flutter build apk --no-pub --debug --dart-define=BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify APK identity, signature and compatibility
        run: |
          set -o pipefail
          APK=ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk
          SDK_ROOT=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build-evidence/apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee build-evidence/apk-badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          info = Path('build-evidence/apk-badging.txt').read_text()
          assert "package: name='com.example.convoy_mesh.pedestrianexp1'" in info
          assert "versionCode='9'" in info and "versionName='0.7.7-exp1'" in info
          assert "application-label:'Convoy Mesh Exp'" in info
          minimum = int(re.search(r"^sdkVersion:'(\d+)'", info, re.M).group(1))
          assert minimum <= 29, f'Unsupported on the API 29 field phone: {minimum}'
          assert "'arm64-v8a'" in info and "'x86_64'" in info
          PY
          sha256sum "$APK" > build-evidence/apk-sha256.txt
          printf '%s\n' 'Candidate debug APK. Automated checks are not real-device BLE/GNSS certification.' > build-evidence/validation-scope.txt
          printf '%s\n' 'Side-by-side package: not an update of com.example.convoy_mesh. Old app/data remain installed. Independent permissions, identity and storage. Use only one Convoy app at a time. Debug key is not retained; future rebuilds are not guaranteed compatible updates. Baseline run #105 APK is unavailable (artifact 10300013706 returns 404); its certificate cannot be compared.' > build-evidence/install-policy.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: convoy-mesh-debug-apk
          path: |
            ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk
            build-evidence/apk-sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Split the exact APK for bounded downloads
        run: |
          # Transport parts only: no second build, signing or APK variant.
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path('ConvoyMeshApp/build/app/outputs/flutter-apk/app-debug.apk')
          output = Path('build-evidence/apk-parts')
          output.mkdir()
          chunk_bytes = 24 * 1024 * 1024
          assert 0 < apk.stat().st_size <= 8 * chunk_bytes, 'APK exceeds bounded transport capacity'
          parts = []
          digest = hashlib.sha256()
          with apk.open('rb') as source:
              while data := source.read(chunk_bytes):
                  name = f'part-{len(parts):02}'
                  (output / name).write_bytes(data)
                  digest.update(data)
                  parts.append({'file': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          expected = Path('build-evidence/apk-sha256.txt').read_text().split()[0]
          assert digest.hexdigest() == expected, 'APK changed after fingerprinting'
          manifest = {
              'source_sha': Path('build-evidence/checkout-sha.txt').read_text().strip(),
              'apk_file': apk.name, 'apk_bytes': apk.stat().st_size,
              'apk_sha256': expected, 'parts': parts,
          }
          Path('build-evidence/apk-transport-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload APK transport part 00
        if: ${{ hashFiles('build-evidence/apk-parts/part-00') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-00
          path: build-evidence/apk-parts/part-00
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 01
        if: ${{ hashFiles('build-evidence/apk-parts/part-01') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-01
          path: build-evidence/apk-parts/part-01
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 02
        if: ${{ hashFiles('build-evidence/apk-parts/part-02') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-02
          path: build-evidence/apk-parts/part-02
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 03
        if: ${{ hashFiles('build-evidence/apk-parts/part-03') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-03
          path: build-evidence/apk-parts/part-03
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 04
        if: ${{ hashFiles('build-evidence/apk-parts/part-04') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-04
          path: build-evidence/apk-parts/part-04
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 05
        if: ${{ hashFiles('build-evidence/apk-parts/part-05') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-05
          path: build-evidence/apk-parts/part-05
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 06
        if: ${{ hashFiles('build-evidence/apk-parts/part-06') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-06
          path: build-evidence/apk-parts/part-06
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK transport part 07
        if: ${{ hashFiles('build-evidence/apk-parts/part-07') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: convoy-apk-part-07
          path: build-evidence/apk-parts/part-07
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convoy-build-provenance
          path: |
            build-evidence/*sha.txt
            build-evidence/*sha256.txt
            build-evidence/flutter-version.json
            build-evidence/resolved-pubspec.lock
            build-evidence/validation-scope.txt
            build-evidence/apk-signature.txt
            build-evidence/apk-badging.txt
            build-evidence/install-policy.txt
            build-evidence/apk-transport-manifest.json
          if-no-files-found: error
          retention-days: 90

  android-emulator-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare diagnostics and KVM
        run: |
          mkdir -p emulator-artifacts
          date -u > emulator-artifacts/job-started.txt
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm > emulator-artifacts/kvm.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the validated APK
        uses: actions/download-artifact@v8
        with:
          name: convoy-mesh-debug-apk
          path: emulator-apk

      - name: Locate exact APK
        run: |
          mapfile -t APKS < <(find emulator-apk -type f -name 'app-debug.apk')
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" emulator-artifacts/candidate.apk
          sha256sum emulator-artifacts/candidate.apk > emulator-artifacts/apk-sha256.txt

      - name: Install and exercise screen-off runtime
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: EXPECTED_BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }} bash tools/android_smoke.sh emulator-artifacts/candidate.apk com.example.convoy_mesh.pedestrianexp1

      - name: Remove duplicate APK from diagnostics
        if: always()
        run: rm -f emulator-artifacts/candidate.apk

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-diagnostics
          path: emulator-artifacts
          if-no-files-found: error
          retention-days: 90
