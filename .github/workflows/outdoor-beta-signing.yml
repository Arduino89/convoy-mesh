name: Outdoor beta signing and upgrade
on:
  push:
    branches: [experiment/frontend-design-studio, experiment/wifi-direct-offline-lab-20261121]
    paths: ['.github/workflows/outdoor-beta-signing.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: outdoor-beta-signing-wifi22
  cancel-in-progress: true
env:
  EXPECTED_CERT: dd058e998369d9e3b46ae91e60177b95a31aa096a6ed04b9f7ba29142480f965
  PACKAGE: com.example.convoy_mesh.outdoor
  BASE_RUN: '44906575990'
  BASE_SOURCE: c70c8729061738fb0eb33d7dfdc2625c19f1613b
  BASE_HASH: f376f63099e0333d676045249e8ae6a80252814e2411071379504d7285d3baef
  NEXT_RUN: '44944296782'
  NEXT_SOURCE: 8f90ac23ed2a19d5daf80ae0b07e93482fce3b9c
  NEXT_HASH: 8a585c4f8c41901f90a776f5f775e06710c7af68db6f456a54f7b98ef121820a
  VERIFIER_SOURCE: |
    import com.android.apksig.ApkVerifier;
    import java.io.File;
    import java.security.MessageDigest;
    import java.security.cert.X509Certificate;
    import java.util.HexFormat;
    import java.util.List;
    
    public class ConvoyApkCertificate {
      static String digest(X509Certificate c) throws Exception {
        return HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(c.getEncoded()));
      }
      static void same(String expected, List<X509Certificate> certs, String scheme) throws Exception {
        if (certs.size() != 1 || !digest(certs.get(0)).equals(expected))
          throw new IllegalStateException("Wrong or ambiguous signer in " + scheme);
      }
      public static void main(String[] args) throws Exception {
        if (args.length != 2 || !args[1].matches("[0-9a-f]{64}"))
          throw new IllegalArgumentException("APK and expected SHA-256 required");
        var r = new ApkVerifier.Builder(new File(args[0])).build().verify();
        if (!r.isVerified() || !r.isVerifiedUsingV2Scheme())
          throw new IllegalStateException("APK or v2 signature not verified: " + r.getErrors());
        String expected = args[1];
        same(expected, r.getSignerCertificates(), "Android signer");
        same(expected, r.getV2SchemeSigners().stream().map(x -> x.getCertificate()).toList(), "v2");
        if (r.isVerifiedUsingV3Scheme())
          same(expected, r.getV3SchemeSigners().stream().map(x -> x.getCertificate()).toList(), "v3");
        if (r.isVerifiedUsingV31Scheme())
          same(expected, r.getV31SchemeSigners().stream().map(x -> x.getCertificate()).toList(), "v3.1");
        if (r.isVerifiedUsingV1Scheme())
          same(expected, r.getV1SchemeSigners().stream().map(x -> x.getCertificate()).toList(), "v1");
        System.out.println("Verified single APK signer across verified schemes: " + expected);
      }
    }
jobs:
  preflight:
    if: github.repository == 'Arduino89/convoy-mesh' && github.ref_name == 'experiment/wifi-direct-offline-lab-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch and verify exact input artifacts without signing secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          fetch() {
            local run="$1" hash="$2" code="$3"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name convoy-mesh-debug-apk --dir "inputs/$code"
            mapfile -t apks < <(find "inputs/$code" -type f -name app-debug.apk)
            test "${#apks[@]}" -eq 1
            printf '%s  %s\n' "$hash" "${apks[0]}" | sha256sum -c -
            mv "${apks[0]}" "inputs/$code.apk"
          }
          fetch "$BASE_RUN" "$BASE_HASH" 21
          fetch "$NEXT_RUN" "$NEXT_HASH" 22
      - name: Exercise actual APK re-signing and verification with disposable RSA key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d "$RUNNER_TEMP/convoy-preflight.XXXXXX")
          trap 'rm -rf -- "$tmp"' EXIT
          export TEST_PASSWORD=$(openssl rand -hex 24)
          keytool -genkeypair -storetype PKCS12 -keystore "$tmp/disposable.p12" -alias convoy-beta -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=Synthetic preflight only' -storepass:env TEST_PASSWORD
          keytool -exportcert -storetype PKCS12 -keystore "$tmp/disposable.p12" -alias convoy-beta -storepass:env TEST_PASSWORD -file "$tmp/disposable.der"
          test_cert=$(sha256sum "$tmp/disposable.der" | cut -d' ' -f1)
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          jar="$tools/lib/apksigner.jar"
          printf '%s\n' "$VERIFIER_SOURCE" > "$tmp/ConvoyApkCertificate.java"
          javac -cp "$jar" "$tmp/ConvoyApkCertificate.java"
          verify() { java -cp "$jar:$tmp" ConvoyApkCertificate "$1" "$2"; }
          for code in 21 22; do
            input="inputs/$code.apk"
            output="$tmp/test-$code.apk"
            "$tools/apksigner" verify "$input"
            "$tools/zipalign" -c -P 16 4 "$input"
            "$tools/apksigner" sign --ks "$tmp/disposable.p12" --ks-type PKCS12 --ks-key-alias convoy-beta --ks-pass env:TEST_PASSWORD --key-pass env:TEST_PASSWORD --out "$output" "$input"
            "$tools/zipalign" -c -P 16 4 "$output"
            "$tools/apksigner" verify --verbose --print-certs "$output"
            verify "$output" "$test_cert"
            if verify "$output" "$EXPECTED_CERT"; then echo 'Wrong-cert counterproof unexpectedly passed'; exit 1; fi
            if verify "$input" "$test_cert"; then echo 'Original debug cert counterproof unexpectedly passed'; exit 1; fi
          done
          echo 'PASS: both exact APKs independently signed and verified using disposable key; wrong certificates rejected'
  sign:
    needs: preflight
    if: github.repository == 'Arduino89/convoy-mesh' && github.ref_name == 'experiment/wifi-direct-offline-lab-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: convoy-beta-signing
    steps:
      - name: Fetch only the approved successful builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          fetch() {
            local run="$1" source="$2" hash="$3" code="$4"
            local expected_branch="experiment/wifi-direct-offline-lab-20261121"
                        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg source "$source" --arg branch "$expected_branch" '.head_sha == $source and .conclusion == "success" and .path == ".github/workflows/android-debug.yml" and .head_branch == $branch' >/dev/null
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name convoy-mesh-debug-apk --dir "inputs/$code"
            mapfile -t apks < <(find "inputs/$code" -type f -name app-debug.apk)
            test "${#apks[@]}" -eq 1
            printf '%s  %s\n' "$hash" "${apks[0]}" | sha256sum -c -
            mv "${apks[0]}" "inputs/$code.apk"
          }
          fetch "$BASE_RUN" "$BASE_SOURCE" "$BASE_HASH" 21
          fetch "$NEXT_RUN" "$NEXT_SOURCE" "$NEXT_HASH" 22
          # Reuse exact signed +20 delivered to owner, rather than recreate its bytes.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44917936770" | jq -e '.head_sha == "bd2cc91e3114b0e2c41f89f49227a7d95621069b" and .conclusion == "success" and .path == ".github/workflows/wifi21-signed-upgrade-check.yml"' >/dev/null
          gh run download 44917936770 --repo "$GITHUB_REPOSITORY" --name convoy-outdoor-beta-21-signed-upgrade-verified --dir inputs/original-signed-21
          printf '%s  %s\n' 'f0287798d8c2301ac899b492bf4986b49ad9e80430505702f903835573aaf101' inputs/original-signed-21/Convoy-Outdoor-Beta-21.apk | sha256sum -c -
          jq -e --arg cert "$EXPECTED_CERT" '.certificate_sha256 == $cert and .version_code == 21 and .source_sha == "c70c8729061738fb0eb33d7dfdc2625c19f1613b" and .apk_sha256 == "f0287798d8c2301ac899b492bf4986b49ad9e80430505702f903835573aaf101"' inputs/original-signed-21/receipt-21.json >/dev/null
      - name: Sign exact reviewed APKs with pinned owner certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.CONVOY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CONVOY_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          require_key() { [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]]; }
          if (KEYSTORE_BASE64=''; require_key); then echo 'Missing-key control failed'; exit 1; fi
          require_key || { echo 'Signing secrets absent; no debug fallback'; exit 1; }
          [[ "$EXPECTED_CERT" =~ ^[a-f0-9]{64}$ ]]
          tmp=$(mktemp -d "$RUNNER_TEMP/convoy-sign.XXXXXX")
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$tmp/key.p12"
          unset KEYSTORE_BASE64
          # Independent check of the public DER certificate before signing.
          # Password comes from the environment; never print or export private key bytes.
          keytool -exportcert -storetype PKCS12 -keystore "$tmp/key.p12" -alias convoy-beta -storepass:env KEYSTORE_PASSWORD -file "$tmp/public.der"
          public_cert=$(sha256sum "$tmp/public.der" | cut -d' ' -f1)
          printf 'Keystore public certificate SHA-256: %s\n' "$public_cert"
          [[ "$public_cert" == "$EXPECTED_CERT" ]] || { echo 'Keystore certificate differs from owner fingerprint; check uploaded file'; exit 1; }
          echo 'Keystore public certificate matches owner fingerprint'
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apksigner="$tools/apksigner"
          aapt="$tools/aapt"
          zipalign="$tools/zipalign"
          mkdir -p staged
          identity() {
            local info
            info=$("$aapt" dump badging "$1")
            grep -Fq "package: name='$2' versionCode='$3' versionName='0.7.7-outdoor'" <<< "$info"
          }
          jar="$tools/lib/apksigner.jar"
          printf '%s\n' "$VERIFIER_SOURCE" > "$tmp/ConvoyApkCertificate.java"
          javac -cp "$jar" "$tmp/ConvoyApkCertificate.java"
          verify_expected() {
            java -cp "$jar:$tmp" ConvoyApkCertificate "$1" "$EXPECTED_CERT"
          }
          # Prove original debug certificate is valid but not the pinned beta signer.
          "$apksigner" verify --verbose --print-certs inputs/22.apk
          if verify_expected inputs/22.apk; then echo 'Wrong-certificate control failed'; exit 1; fi
          if identity inputs/22.apk com.example.convoy_mesh.wrong 22; then echo 'Wrong-package control failed'; exit 1; fi
          sign_one() {
            local code="$1" source="$2" hash="$3" run="$4"
            local input="inputs/$code.apk" output="staged/Convoy-Outdoor-Beta-$code.apk"
            printf '%s  %s\n' "$hash" "$input" | sha256sum -c -
            identity "$input" "$PACKAGE" "$code"
            "$apksigner" verify "$input"
            "$zipalign" -c -P 16 4 "$input"
            "$apksigner" sign --ks "$tmp/key.p12" --ks-type PKCS12 --ks-key-alias convoy-beta --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$output" "$input"
            "$zipalign" -c -P 16 4 "$output"
            identity "$output" "$PACKAGE" "$code"
            "$apksigner" verify --verbose --print-certs "$output" | tee "staged/certificate-$code.txt"
            verify_expected "$output" || { echo 'Owner certificate verification failed'; exit 1; }
            "$aapt" dump badging "$output" > "staged/badging-$code.txt"
            sha=$(sha256sum "$output" | cut -d' ' -f1)
            bytes=$(stat -c%s "$output")
            jq -n --arg source "$source" --arg run "$run" --arg input "$hash" --arg sha "$sha" --arg cert "$EXPECTED_CERT" --arg package "$PACKAGE" --argjson version "$code" --argjson bytes "$bytes" '{source_sha:$source,build_run:$run,input_sha256:$input,apk_sha256:$sha,certificate_sha256:$cert,package:$package,version_code:$version,apk_bytes:$bytes}' > "staged/receipt-$code.json"
          }
          sign_one 21 "$BASE_SOURCE" "$BASE_HASH" "$BASE_RUN"
          sign_one 22 "$NEXT_SOURCE" "$NEXT_HASH" "$NEXT_RUN"
          # Restore exact original signed +21 for update check.
          cp -- inputs/original-signed-21/Convoy-Outdoor-Beta-21.apk staged/Convoy-Outdoor-Beta-21.apk
          cp -- inputs/original-signed-21/receipt-21.json staged/receipt-21.json
          cp -- inputs/original-signed-21/certificate-21.txt staged/certificate-21.txt
          cp -- inputs/original-signed-21/badging-21.txt staged/badging-21.txt
          printf '%s  %s\n' 'f0287798d8c2301ac899b492bf4986b49ad9e80430505702f903835573aaf101' staged/Convoy-Outdoor-Beta-21.apk | sha256sum -c -
          verify_expected staged/Convoy-Outdoor-Beta-21.apk
          unset KEYSTORE_PASSWORD
          rm -rf -- "$tmp"
          trap - EXIT
          (cd staged && sha256sum *.apk > SHA256SUMS.txt)
      - name: Stage signed pair for emulator only
        uses: actions/upload-artifact@v7
        with:
          name: outdoor-beta-staged-not-yet-approved
          path: staged/
          retention-days: 3
          if-no-files-found: error
  upgrade:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Retrieve signed pair (no signing secrets)
        uses: actions/download-artifact@v8
        with:
          name: outdoor-beta-staged-not-yet-approved
          path: pair
      - name: Reuse exact prior signed +19/+20 for conservative upgrade proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44815769826" | jq -e '.conclusion == "success" and .path == ".github/workflows/outdoor-beta-signing.yml"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44879655100" | jq -e '.conclusion == "success" and .path == ".github/workflows/outdoor-beta-signing.yml"' >/dev/null
          mkdir -p prior19 prior20
          gh run download 44815769826 --repo "$GITHUB_REPOSITORY" --name convoy-outdoor-beta-19-signed --dir prior19
          gh run download 44879655100 --repo "$GITHUB_REPOSITORY" --name convoy-outdoor-beta-20-signed --dir prior20
          printf '%s  %s\n' '0da3e4b7787ca8e49d21b6e2dfa9b08915a9c7c30a5d49c37f8980ba1dbbfe59' prior19/Convoy-Outdoor-Beta-19.apk | sha256sum -c -
          printf '%s  %s\n' '476e923dcd5dcddfd31a84a4b60c05737616163eddfcaddf97cde0d13cb4dd75' prior20/Convoy-Outdoor-Beta-20.apk | sha256sum -c -
          cp prior19/Convoy-Outdoor-Beta-19.apk pair/
          cp prior20/Convoy-Outdoor-Beta-20.apk pair/
      - name: Verify staged hashes and exact identity
        run: |
          set -euo pipefail
          cd pair
          sha256sum -c SHA256SUMS.txt
          for code in 21 22; do
            jq -e --arg cert "$EXPECTED_CERT" --argjson code "$code" --arg package "$PACKAGE" '.certificate_sha256 == $cert and .version_code == $code and .package == $package' "receipt-$code.json" >/dev/null
          done
      - name: Prepare KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Create upgrade check
        run: |
          cat > "$RUNNER_TEMP/convoy-upgrade.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p evidence
          collect() {
            adb shell pidof "$PACKAGE" > evidence/process-last.txt 2>&1 || true
            adb logcat -d > evidence/emulator-logcat.txt 2>&1 || true
            adb shell dumpsys activity activities > evidence/activities-last.txt 2>&1 || true
            adb shell dumpsys package "$PACKAGE" > evidence/package-last.txt 2>&1 || true
          }
          trap collect EXIT
          install_code() {
            local code="$1" mode="$2"
            adb install $mode "pair/Convoy-Outdoor-Beta-$code.apk" | tee "evidence/install-$code.txt"
            grep -Fq Success "evidence/install-$code.txt"
            adb shell dumpsys package "$PACKAGE" | grep -m1 versionCode= > "evidence/version-$code.txt"
            grep -Fq "versionCode=$code " "evidence/version-$code.txt"
          }
          capture_prefs() {
            local label="$1" deadline=$((SECONDS + 60))
            while (( SECONDS < deadline )); do
              if adb exec-out run-as "$PACKAGE" cat shared_prefs/FlutterSharedPreferences.xml > "evidence/prefs-$label.xml" 2>/dev/null &&
                grep -Fq 'flutter.my_id' "evidence/prefs-$label.xml"; then
                return 0
              fi
              sleep 2
            done
            echo "::error::Missing Flutter identity preferences on $label; retaining diagnostic evidence"
            return 1
          }
          launch() {
            local label="$1"
            adb shell am start -n "$PACKAGE/com.example.convoy_mesh.MainActivity" | tee "evidence/launch-$label.txt"
            if grep -Eq 'Error:|Exception' "evidence/launch-$label.txt"; then return 1; fi
          }
          install_code 19 ''
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE POST_NOTIFICATIONS; do
            adb shell pm grant "$PACKAGE" "android.permission.$p"
          done
          launch 19
          capture_prefs 19
          adb shell am force-stop "$PACKAGE"
          adb shell "run-as $PACKAGE mkdir -p files/convoy-diagnostics"
          printf 'CONVOY_SYNTHETIC_UPGRADE_MARKER\n' > evidence/marker-before.txt
          adb shell "run-as $PACKAGE sh -c 'cat > files/convoy-diagnostics/upgrade-proof.txt'" < evidence/marker-before.txt
          adb shell dumpsys package "$PACKAGE" > evidence/package-19.txt
          install_code 20 -r
          adb exec-out run-as "$PACKAGE" cat shared_prefs/FlutterSharedPreferences.xml > evidence/prefs-20.xml
          cmp evidence/prefs-19.xml evidence/prefs-20.xml
          adb shell dumpsys package "$PACKAGE" > evidence/package-20.txt
          launch 20
          for i in $(seq 1 30); do
            if adb shell pidof "$PACKAGE" | grep -q '[0-9]'; then break; fi
            sleep 2
          done
          adb shell pidof "$PACKAGE" | grep -q '[0-9]'
          adb shell am force-stop "$PACKAGE"
          install_code 21 -r
          adb exec-out run-as "$PACKAGE" cat shared_prefs/FlutterSharedPreferences.xml > evidence/prefs-21.xml
          adb exec-out run-as "$PACKAGE" cat files/convoy-diagnostics/upgrade-proof.txt > evidence/marker-after.txt
          cmp evidence/prefs-20.xml evidence/prefs-21.xml
          cmp evidence/marker-before.txt evidence/marker-after.txt
          adb shell dumpsys package "$PACKAGE" > evidence/package-21.txt
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE POST_NOTIFICATIONS; do
            grep -Fq "android.permission.$p: granted=true" evidence/package-20.txt
            grep -Fq "android.permission.$p: granted=true" evidence/package-21.txt
          done
          launch 21
          for i in $(seq 1 20); do
            if adb shell pidof "$PACKAGE" | grep -q '[0-9]'; then break; fi
            sleep 2
          done
          adb shell pidof "$PACKAGE" | grep -q '[0-9]'
          sleep 5
          adb shell pidof "$PACKAGE" | grep -q '[0-9]'
          adb shell am force-stop "$PACKAGE"
          install_code 22 -r
          adb exec-out run-as "$PACKAGE" cat shared_prefs/FlutterSharedPreferences.xml > evidence/prefs-22.xml
          cmp evidence/prefs-21.xml evidence/prefs-22.xml
          adb exec-out run-as "$PACKAGE" cat files/convoy-diagnostics/upgrade-proof.txt > evidence/marker-after-22.txt
          cmp evidence/marker-before.txt evidence/marker-after-22.txt
          adb shell dumpsys package "$PACKAGE" > evidence/package-22.txt
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE POST_NOTIFICATIONS; do
            grep -Fq "android.permission.$p: granted=true" evidence/package-21.txt
            grep -Fq "android.permission.$p: granted=true" evidence/package-22.txt
          done
          launch 22
          for i in $(seq 1 30); do
            if adb shell pidof "$PACKAGE" | grep -q '[0-9]'; then break; fi
            sleep 2
          done
          adb shell pidof "$PACKAGE" | grep -q '[0-9]'
          sleep 5
          adb shell pidof "$PACKAGE" | grep -q '[0-9]'
          if adb install -r pair/Convoy-Outdoor-Beta-21.apk > evidence/downgrade.txt 2>&1; then echo 'Unexpected downgrade'; exit 1; fi
          grep -Fq INSTALL_FAILED_VERSION_DOWNGRADE evidence/downgrade.txt
          echo 'PASS: +19 -> +20 -> +21 -> +22 signed in-place; identity prefs, diagnostic marker and permissions preserved; app launches; downgrade blocked.' | tee evidence/result.txt
          SH
      - name: Verify update on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash "$RUNNER_TEMP/convoy-upgrade.sh"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outdoor-beta-upgrade-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Deliver validated signed +22 (artifact only, no release)
        uses: actions/upload-artifact@v7
        with:
          name: convoy-outdoor-beta-22-signed
          path: |
            pair/Convoy-Outdoor-Beta-22.apk
            pair/receipt-22.json
            pair/certificate-22.txt
            pair/badging-22.txt
          if-no-files-found: error
          retention-days: 90
