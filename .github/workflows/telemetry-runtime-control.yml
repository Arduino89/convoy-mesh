name: Isolated Android telemetry laboratory
on:
  push:
    branches: [experiment/telemetry-runtime-lab]
    paths: ['.github/workflows/telemetry-runtime-control.yml']
concurrency:
  group: telemetry-lab-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  full-sender-local:
    if: >-
      github.repository == 'Arduino89/convoy-mesh' &&
      github.event.repository.private == false &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/experiment/telemetry-runtime-lab' &&
      github.run_number == 17 &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Verify full Android sender on loopback only (zero PostHog)'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      BOT: "true"
      LAB_RUN_ID: synthetic-http-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 50386a5c8ce5b0cf628073989a0eaf1549008e79
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify host controls
        run: python3 -m unittest discover -s tools/telemetry_spike -p 'test_*.py' -q
      - name: Require accelerated host and pinned toolchain
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build lifecycle control
        run: >-
          python3 tools/telemetry_spike/runtime_control/build.py
          --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --out "$RUNNER_TEMP/runtime-control-build"
      - name: Control Android then verify full sender on loopback
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash tools/telemetry_spike/run_ci_full_sender.sh
      - name: Emit sanitized local evidence only
        if: always()
        run: |
          python3 tools/telemetry_spike/emit_ci_evidence.py "$RUNNER_TEMP"
          if test -f "$RUNNER_TEMP/full-proof-public/result.json"; then
            python3 tools/telemetry_spike/ci_full_sender.py --emit "$RUNNER_TEMP/full-proof-public/result.json"
          fi
