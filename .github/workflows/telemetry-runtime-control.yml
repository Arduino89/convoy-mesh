name: Isolated Android runtime control
on:
  workflow_dispatch:
  push:
    branches: [experiment/telemetry-runtime-lab]
    paths:
      - 'tools/telemetry_spike/runtime_control/**'
      - '.github/workflows/telemetry-runtime-control.yml'
concurrency:
  group: telemetry-lab-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  runtime-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require accelerated host
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Prepare pinned control toolchain
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build tiny native control only
        run: >-
          python3 tools/telemetry_spike/runtime_control/build.py
          --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
          --out "$RUNNER_TEMP/runtime-control-build"
      - name: Boot, install, open, stop and reopen control
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: >-
            python3 tools/telemetry_spike/runtime_control/smoke.py
            --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
            --apk "$RUNNER_TEMP/runtime-control-build/runtime-control.apk"
            --build-receipt "$RUNNER_TEMP/runtime-control-build/build-receipt.json"
            --serial emulator-5554 --out "$RUNNER_TEMP/runtime-control-smoke"
            --timeout 60
      - name: Emit scoped receipts without artifact or cache storage
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for name in ('runtime-control-build/build-receipt.json', 'runtime-control-smoke/receipt.json'):
              path = root / name
              if path.is_file():
                  data = json.loads(path.read_text())
                  print('CONVOY_RUNTIME_RECEIPT=' + json.dumps({'path': name, 'data': data}, separators=(',', ':')))
          PYCODE
