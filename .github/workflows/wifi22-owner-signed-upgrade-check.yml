name: Wi-Fi +22 signed in-place Android upgrade gate
on:
  push:
    branches: [experiment/wifi-direct-offline-lab-20261121]
    paths: ['.github/workflows/wifi22-owner-signed-upgrade-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: convoy-wifi22-signed-update-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      PACKAGE: com.example.convoy_mesh.outdoor
      CERT: dd058e998369d9e3b46ae91e60177b95a31aa096a6ed04b9f7ba29142480f965
      HASH21: f0287798d8c2301ac899b492bf4986b49ad9e80430505702f903835573aaf101
      HASH22: a16cc631cb42c162fd084414890369829946d3125831af54f89a16eb5f27eb2f
    steps:
      - name: Fetch exact signed +21 and +22 from protected signing run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44944924617" | jq -e '.head_sha == "7bf9876bb081e10882ea7df58bc9af0c6ce3ad46" and .path == ".github/workflows/outdoor-beta-signing.yml"' >/dev/null
          mkdir -p pair evidence
          gh run download 44944924617 --repo "$GITHUB_REPOSITORY" --name outdoor-beta-staged-not-yet-approved --dir pair
          cd pair
          sha256sum -c SHA256SUMS.txt
          printf '%s  %s\n' "$HASH21" Convoy-Outdoor-Beta-21.apk | sha256sum -c -
          printf '%s  %s\n' "$HASH22" Convoy-Outdoor-Beta-22.apk | sha256sum -c -
          jq -e --arg cert "$CERT" --arg sha "$HASH21" --arg pkg "$PACKAGE" '.certificate_sha256 == $cert and .apk_sha256 == $sha and .package == $pkg and .version_code == 21 and .source_sha == "c70c8729061738fb0eb33d7dfdc2625c19f1613b"' receipt-21.json >/dev/null
          jq -e --arg cert "$CERT" --arg sha "$HASH22" --arg pkg "$PACKAGE" '.certificate_sha256 == $cert and .apk_sha256 == $sha and .package == $pkg and .version_code == 22 and .source_sha == "8f90ac23ed2a19d5daf80ae0b07e93482fce3b9c" and .build_run == "44944296782"' receipt-22.json >/dev/null
          cd ..
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for code in 21 22; do
            apk="pair/Convoy-Outdoor-Beta-$code.apk"
            "$TOOLS/apksigner" verify --verbose --print-certs "$apk" > "evidence/apksigner-$code.txt"
            grep -Fq "certificate SHA-256 digest: $CERT" "evidence/apksigner-$code.txt"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "evidence/apksigner-$code.txt"
            "$TOOLS/aapt" dump badging "$apk" > "evidence/badging-$code.txt"
            grep -Fq "package: name='$PACKAGE' versionCode='$code' versionName='0.7.7-outdoor'" "evidence/badging-$code.txt"
          done
          printf '%s\n' 'Exact input +21/+22, signer and source receipts verified.' > evidence/inputs.txt
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Prepare synthetic-data-only in-place upgrade proof
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/wifi22-upgrade.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p evidence
          collect() {
            adb logcat -d > evidence/logcat.txt 2>&1 || true
            adb shell dumpsys package "$PACKAGE" > evidence/package-final.txt 2>&1 || true
            adb shell dumpsys activity activities > evidence/activity-final.txt 2>&1 || true
          }
          trap collect EXIT
          assert_version() {
            adb shell dumpsys package "$PACKAGE" | grep -m1 'versionCode=' > "evidence/version-$1.txt"
            grep -Fq "versionCode=$1 " "evidence/version-$1.txt"
          }
          adb install pair/Convoy-Outdoor-Beta-21.apk | tee evidence/install-21.txt
          grep -Fq Success evidence/install-21.txt
          assert_version 21
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE POST_NOTIFICATIONS; do
            adb shell pm grant "$PACKAGE" "android.permission.$p"
          done
          # Deliberately seed private synthetic preferences: the previous cold-start
          # +19 identity-bootstrap test timed out. This tests Android's in-place
          # persistence, NOT the cold-start identity contract; keep that HOLD.
          cat > evidence/prefs-before.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <map>
            <string name="flutter.my_id">4242</string>
            <string name="flutter.my_name">SyntheticWiFiUpgrade</string>
          </map>
          XML
          printf 'CONVOY_SYNTHETIC_UPGRADE_MARKER\n' > evidence/marker-before.txt
          adb shell "run-as $PACKAGE mkdir -p shared_prefs files/convoy-diagnostics"
          adb shell "run-as $PACKAGE sh -c 'cat > shared_prefs/FlutterSharedPreferences.xml'" < evidence/prefs-before.xml
          adb shell "run-as $PACKAGE sh -c 'cat > files/convoy-diagnostics/upgrade-proof.txt'" < evidence/marker-before.txt
          adb exec-out run-as "$PACKAGE" cat shared_prefs/FlutterSharedPreferences.xml > evidence/prefs-21.xml
          adb exec-out run-as "$PACKAGE" cat files/convoy-diagnostics/upgrade-proof.txt > evidence/marker-21.txt
          cmp evidence/prefs-before.xml evidence/prefs-21.xml
          cmp evidence/marker-before.txt evidence/marker-21.txt
          adb shell dumpsys package "$PACKAGE" > evidence/package-21.txt
          adb install -r pair/Convoy-Outdoor-Beta-22.apk | tee evidence/install-22.txt
          grep -Fq Success evidence/install-22.txt
          assert_version 22
          adb exec-out run-as "$PACKAGE" cat shared_prefs/FlutterSharedPreferences.xml > evidence/prefs-22.xml
          adb exec-out run-as "$PACKAGE" cat files/convoy-diagnostics/upgrade-proof.txt > evidence/marker-22.txt
          cmp evidence/prefs-21.xml evidence/prefs-22.xml
          cmp evidence/marker-21.txt evidence/marker-22.txt
          adb shell dumpsys package "$PACKAGE" > evidence/package-22.txt
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE POST_NOTIFICATIONS; do
            grep -Fq "android.permission.$p: granted=true" evidence/package-21.txt
            grep -Fq "android.permission.$p: granted=true" evidence/package-22.txt
          done
          adb shell am start -n "$PACKAGE/com.example.convoy_mesh.MainActivity" | tee evidence/launch-22.txt
          for i in $(seq 1 30); do
            if adb shell pidof "$PACKAGE" | grep -q '[0-9]'; then break; fi
            sleep 2
          done
          adb shell pidof "$PACKAGE" | grep -q '[0-9]'
          sleep 5
          adb shell pidof "$PACKAGE" | grep -q '[0-9]'
          if adb install -r pair/Convoy-Outdoor-Beta-21.apk > evidence/downgrade.txt 2>&1; then
            echo "::error::Downgrade incorrectly accepted"; exit 1
          fi
          grep -Fq INSTALL_FAILED_VERSION_DOWNGRADE evidence/downgrade.txt
          echo 'PASS: actual signed +21 to signed +22 in-place, synthetic preferences/diagnostics and permissions preserved, +22 launches, downgrade rejected. Cold-install initialization NOT tested.' | tee evidence/result.txt
          SH
      - name: Exercise signed update on Android 35
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash "$RUNNER_TEMP/wifi22-upgrade.sh"
      - name: Preserve all evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convoy-wifi22-upgrade-evidence
          path: evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Deliver exact owner-signed +22 after successful upgrade test
        uses: actions/upload-artifact@v7
        with:
          name: convoy-outdoor-beta-22-signed-verified
          path: |
            pair/Convoy-Outdoor-Beta-22.apk
            pair/receipt-22.json
            pair/certificate-22.txt
            pair/badging-22.txt
          retention-days: 90
          if-no-files-found: error
